name: Aggiorna calendario

on:
  schedule:
    # Snapshot rigenerato spesso: e' l'unico modo per avere dati freschi su
    # telefono, dove il fetch dal vivo non e' possibile (FIPAV dirotta i
    # browser mobili su una versione senza tabelle). Su PC il sito legge
    # comunque FIPAV dal vivo ad ogni apertura.
    # Ogni 15 minuti nella fascia gare (08:00-23:00 UTC).
    - cron: "*/15 8-23 * * *"
    # Una passata notturna di sicurezza.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Importa calendario e classifiche
        run: python importer/import_schedule.py

      - name: Commit se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/schedule.json site/assets/loghi
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "Aggiorna calendario [skip ci]"
            git push
          fi
