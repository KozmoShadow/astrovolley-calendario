name: Aggiorna calendario

on:
  schedule:
    # Solo nelle ore in cui si gioca: le partite finiscono tra le 19 e le 23
    # italiane, che in UTC sono le 17-22 (18-23 d'inverno, 19-24 d'estate).
    # Fuori da quella fascia il calendario non cambia, quindi girare di notte
    # serve solo a consumare minuti.
    #
    # ATTENZIONE: GitHub non garantisce la puntualita' dei cron sui repo
    # pubblici poco attivi. Nella pratica le run arrivano ogni 2-5 ore, non
    # ogni 10 minuti. Il sito non dipende da questo: legge FIPAV e ASI dal vivo
    # nel browser ad ogni apertura, e questo snapshot serve solo come riserva
    # (soprattutto da telefono, dove FIPAV blocca il fetch).
    - cron: "*/10 17-22 * * *"
  # Rigenera anche quando cambiano i dati ASI scritti a mano: cosi' i risultati
  # inseriti in data/asi/*.risultati.json entrano subito in schedule.json.
  push:
    paths:
      - "data/asi/**"
      - "data/manual.json"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # serve per avviare il deploy a fine ricalcolo

concurrency:
  group: aggiorna-calendario
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Pillow
        # Serve all'importer per ridimensionare i loghi e convertirli in WebP.
        run: python -m pip install --quiet --disable-pip-version-check Pillow

      - name: Scarica i campionati ASI
        # Se l'API ASI non risponde, l'importer continua con i file gia' in
        # repo: un errore qui non deve fermare l'aggiornamento FIPAV.
        continue-on-error: true
        run: python importer/asi_api.py

      - name: Importa calendario e classifiche
        run: python importer/import_schedule.py

      - name: Aggiorna le palestre della pagina prenota
        # La pagina prenota mostra la palestra accanto a data e ora. Il nome sta
        # nel calendario, quindi va rigenerato ogni volta che cambia.
        run: python scripts/genera_palestre.py

      - name: Commit se ci sono cambiamenti
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/schedule.json site/data/partite-casa.csv site/data/partite-altra-societa.json site/assets/loghi data/asi site/prenota/palestre.js
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "Aggiorna calendario"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Il push fatto con GITHUB_TOKEN non fa partire altri workflow, quindi il
      # deploy va avviato a mano. Cosi' il sito pubblica sempre i dati freschi.
      - name: Avvia il deploy del sito
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
