name: Aggiorna calendario

on:
  schedule:
    # Ogni giorno alle 06:00 UTC (07:00/08:00 in Italia a seconda dell'ora legale)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Importa calendario e classifiche
        run: python importer/import_schedule.py

      - name: Commit se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/schedule.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "Aggiorna calendario [skip ci]"
            git push
          fi
