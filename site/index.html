<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASD Astrovolley — Calendario e Classifiche</title>
  <meta name="description" content="Calendario unico di tutte le partite dell'ASD Astrovolley: campionati FIPAV e ASI, in ordine cronologico, con classifiche dei gironi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <img class="brand-mark" src="assets/logo.jpg" alt="Logo ASD Astrovolley" />
        <div>
          <h1 id="societa">ASD Astrovolley</h1>
          <p class="season">Stagione <span id="stagione">—</span></p>
        </div>
      </div>
      <p class="tagline">Tutte le partite della società, in un unico calendario.</p>
        <p class="updated" id="updated">—</p>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <button id="toggle-standings" class="btn-standings" aria-expanded="false" aria-controls="standings-panel">
        Classifiche
      </button>
      <label class="search">
        <span class="sr-only">Cerca squadra o palestra</span>
        <input id="search" type="search" placeholder="Cerca squadra o palestra…" />
      </label>
    </div>

    <section id="standings-panel" class="panel standings-panel" hidden>
      <h2>Classifiche</h2>
      <div id="standings" class="standings"></div>
    </section>

    <nav class="chips" id="view-filter" aria-label="Vista"></nav>

    <section class="panel">
      <h2 id="list-title">Le nostre partite</h2>
      <div id="calendar" class="calendar" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>Dati FIPAV Napoli (fonte ufficiale) · Competizioni ASI inserite manualmente · Le classifiche ufficiali fanno fede solo sui comunicati federali.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
